services:
  db:
    image: postgres:16-alpine
    container_name: fusedproductions-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fused
      POSTGRES_PASSWORD: fused
      POSTGRES_DB: fused
    ports:
      - "5433:5432"
    volumes:
      - fused_pg:/var/lib/postgresql/data

  web:
    build: .
    container_name: fusedproductions-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FUSED_DEMO_PAYMENTS: ${FUSED_DEMO_PAYMENTS:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-http://localhost:3010}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3010}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    networks:
      - gateway

networks:
  gateway:
    external: true

volumes:
  fused_pg:
