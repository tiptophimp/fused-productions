# Production deployment config for the GMKtec host.
#
# Deploy-only: there is deliberately no `build:` stanza here, so a `docker compose
# up` in the deployment directory can never rebuild from whatever source happens
# to be sitting on disk.
name: fused-productions

services:
  fusedproductions-web:
    image: ${FUSED_IMAGE:?FUSED_IMAGE must be set to a SHA-pinned GHCR tag}
    container_name: fusedproductions-web
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FUSED_DEMO_PAYMENTS: ${FUSED_DEMO_PAYMENTS:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SITE_URL: ${SITE_URL:-https://fusedproductions.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://fusedproductions.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
    restart: always
    networks:
      - gateway

networks:
  gateway:
    external: true
